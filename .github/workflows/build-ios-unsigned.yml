name: iOS unsigned build validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'LibertyRecomp/**'
      - 'LibertyRecompLib/**'
      - 'cmake/**'
      - 'toolchains/**'
      - 'thirdparty/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'tools/setup_repo.py'
      - '.github/workflows/build-ios-unsigned.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-unsigned-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-device-compile:
    name: iOS arm64 compile (unsigned; no game data)
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - name: Checkout source and pinned submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install build tools
        run: brew install cmake ninja pkg-config llvm openssl@3 vulkan-loader

      - name: Record toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          cmake --version
          python3 --version

      - name: Prepare pinned dependencies
        run: python3 tools/setup_repo.py

      # The current iOS preset requires the presence of game payload filenames
      # at configure time. Empty placeholders allow a compile-only check without
      # copying or distributing copyrighted game data. This artifact is NOT
      # playable and is NOT intended for installation.
      - name: Prepare compile-only payload placeholders
        run: |
          mkdir -p tools/local_game_payload
          for file in default.xex common.rpf xbox360.rpf audio.rpf; do
            : > "tools/local_game_payload/$file"
          done

      - name: Configure unsigned iOS arm64 app
        run: |
          cmake --preset ios-release \
            -DLIBERTY_IOS_BUNDLE_IDENTIFIER=com.ompergo.gta4universal.test \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO

      - name: Compile iOS app target
        run: cmake --build --preset ios-release --target LibertyRecomp --config Release --parallel 3

      - name: Verify app bundle was produced
        run: |
          set -euo pipefail
          APP="$(find out/build/ios-release -type d -name '*.app' -print -quit)"
          if [[ -z "$APP" ]]; then
            echo "::error::No iOS .app bundle was produced"
            find out/build/ios-release -maxdepth 5 -type f | head -200
            exit 1
          fi
          echo "Unsigned compile-check app: $APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$RUNNER_TEMP/LibertyRecomp-iOS-unsigned-compile-check.zip"

      - name: Upload unsigned compile-check artifact
        uses: actions/upload-artifact@v4
        with:
          name: LibertyRecomp-iOS-unsigned-compile-check
          path: ${{ runner.temp }}/LibertyRecomp-iOS-unsigned-compile-check.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload CMake diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-diagnostics
          path: |
            out/build/**/CMakeFiles/CMakeOutput.log
            out/build/**/CMakeFiles/CMakeError.log
            out/build/**/CMakeCache.txt
            out/build/**/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore
          retention-days: 7
